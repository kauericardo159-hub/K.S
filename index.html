<script>
    // Usamos 'var' para blindar o escopo e garantir leitura universal sem travar
    var emManutencaoManual = false; 
    
    // Data alvo para teste ou liberação programada
    var dataLiberacaoTexto = "2026-07-29T13:00:00"; 
    
    // Conteúdo da tela de manutenção
    var tituloManutencao = "Atualização & Correções";
    var mensagemManutencao = "O site está recebendo pequena atualização, também outro site que faz parte desse site está recebendo atualização ao mesmo tempo, vai ser liberado assim que surgir um tempo.  <br><br> Versão Final?... ";

    var emManutencao = emManutencaoManual;
    var dataAlvoObjeto = null;

    if (!emManutencao && dataLiberacaoTexto) {
        dataAlvoObjeto = new Date(dataLiberacaoTexto);
        if (!isNaN(dataAlvoObjeto.getTime())) {
            if (new Date() < dataAlvoObjeto) emManutencao = true;
        }
    }
</script>

<script>
    (function() {
        'use strict';

        // 1. Registro Otimizado do Service Worker (Escopo Restrito ao PWA Único)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Forçamos o escopo './' para combinar com o manifest.json
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then(reg => {
                        console.log('K & S: PWA Ativo e Isolado (Escopo: ./)');
                        
                        // Solicita verificação de atualização em background
                        reg.update().catch(() => {});

                        // Solicita persistência de armazenamento local
                        if (navigator.storage && navigator.storage.persist) {
                            navigator.storage.persist();
                        }
                    })
                    .catch(err => console.error('K & S: Erro no Service Worker', err));
            });
        }

        // 2. Sistema Dinâmico de Alerta de Conexão no Rodapé (Online / Offline)
        const criarAvisoRede = () => {
            if (document.getElementById('pwa-aviso-rede')) return;

            const aviso = document.createElement('div');
            aviso.id = 'pwa-aviso-rede';
            
            // Estilização Flutuante no Rodapé (Bottom)
            const style = document.createElement('style');
            style.textContent = `
                #pwa-aviso-rede {
                    position: fixed;
                    bottom: 24px;
                    left: 50%;
                    transform: translateX(-50%) translateY(120px);
                    background: rgba(10, 12, 22, 0.94);
                    border: 1px solid rgba(239, 68, 68, 0.35);
                    color: #f8fafc;
                    padding: 11px 22px;
                    border-radius: 30px;
                    font-family: 'Plus Jakarta Sans', 'Poppins', sans-serif;
                    font-size: 0.78rem;
                    font-weight: 600;
                    backdrop-filter: blur(14px);
                    -webkit-backdrop-filter: blur(14px);
                    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.65), 0 0 15px rgba(239, 68, 68, 0.15);
                    z-index: 100000;
                    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    pointer-events: none;
                    white-space: nowrap;
                    max-width: calc(100vw - 40px);
                    box-sizing: border-box;
                }
                #pwa-aviso-rede.visivel {
                    transform: translateX(-50%) translateY(0);
                }
                #pwa-aviso-rede.online {
                    border-color: rgba(0, 229, 255, 0.4);
                    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.65), 0 0 15px rgba(0, 229, 255, 0.2);
                }
                .pwa-ponto-status {
                    width: 8px;
                    height: 8px;
                    border-radius: 50%;
                    background: #ef4444;
                    box-shadow: 0 0 8px #ef4444;
                    flex-shrink: 0;
                    transition: background 0.4s ease, box-shadow 0.4s ease;
                }
                #pwa-aviso-rede.online .pwa-ponto-status {
                    background: #00e5ff;
                    box-shadow: 0 0 8px #00e5ff;
                }

                @media (max-width: 600px) {
                    #pwa-aviso-rede {
                        bottom: 16px;
                        font-size: 0.73rem;
                        padding: 10px 18px;
                    }
                }
            `;
            document.head.appendChild(style);

            aviso.innerHTML = `<span class="pwa-ponto-status"></span><span id="pwa-texto-rede">Você está offline. Exibindo memórias salvas!</span>`;
            document.body.appendChild(aviso);
        };

        const atualizarStatusRede = () => {
            criarAvisoRede();
            const aviso = document.getElementById('pwa-aviso-rede');
            const texto = document.getElementById('pwa-texto-rede');

            if (!aviso || !texto) return;

            if (!navigator.onLine) {
                // Estado Offline (Aviso sobe e fica visível)
                aviso.classList.remove('online');
                aviso.classList.add('visivel');
                texto.textContent = 'Você está offline. Exibindo memórias salvas!';
            } else {
                // Estado Online Reativado (Fica ciano por 3.5s e recolhe)
                if (aviso.classList.contains('visivel')) {
                    aviso.classList.add('online');
                    texto.textContent = 'Conexão reestabelecida! Atualizações ativas.';
                    setTimeout(() => {
                        aviso.classList.remove('visivel');
                    }, 3500);
                }
            }
        };

        // Eventos de escuta de rede
        window.addEventListener('online', atualizarStatusRede);
        window.addEventListener('offline', atualizarStatusRede);

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                if (!navigator.onLine) atualizarStatusRede();
            });
        } else {
            if (!navigator.onLine) atualizarStatusRede();
        }

        // 3. Prevenção de Gestos de Recarregamento e Rolagem Indesejada
        const styleScroll = document.createElement('style');
        styleScroll.textContent = `
            html, body {
                overscroll-behavior-y: contain;
                -webkit-overflow-scrolling: touch;
                overflow-x: hidden;
                scroll-behavior: smooth;
            }
        `;
        document.head.appendChild(styleScroll);
    })();
</script>
